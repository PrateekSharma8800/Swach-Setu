<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title">
  <title id="logo-title">SwachSetu logo: a leaf growing on a bridge</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5132"/>
      <stop offset="1" stop-color="#1f9d5c"/>
    </linearGradient>
  </defs>

  <!-- Green rounded badge -->
  <rect width="64" height="64" rx="16" fill="url(#badge)"/>

  <!-- Leaf ("swach" = clean, green) growing from the middle of the bridge -->
  <path d="M32 34 C21.5 30 20.5 16.5 33 7 C42.5 16.5 41.5 29.5 32 34 Z" fill="#a7e8c2"/>
  <path d="M32 34 C32.6 26 34 19 36.8 12.5" fill="none" stroke="#146c43" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Bridge ("setu"): road deck on top, arch below, pillars -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 36 H57" stroke-width="4"/>            <!-- road deck -->
    <path d="M14 50 Q32 22 50 50" stroke-width="3.6"/>  <!-- arch -->
    <path d="M14 36 V50" stroke-width="3.6"/>           <!-- left pillar -->
    <path d="M50 36 V50" stroke-width="3.6"/>           <!-- right pillar -->
    <path d="M20 36 V42.5" stroke-width="2.4"/>         <!-- small supports -->
    <path d="M44 36 V42.5" stroke-width="2.4"/>
  </g>

  <!-- Water under the bridge -->
  <path d="M17 56 Q20.5 53.5 24 56 T31 56 T38 56 T45 56" fill="none" stroke="#a7e8c2" stroke-width="2.4" stroke-linecap="round"/>
</svg>
